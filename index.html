<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SONIM AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    /* AR BUTTON - TOP LEFT */
    #ar-button {
      position: absolute;
      top: 20px;
      left: 20px;

      background: white;
      color: black;

      border: none;
      border-radius: 25px;

      padding: 14px 24px;

      font-size: 16px;
      font-weight: bold;

      z-index: 100;
      cursor: pointer;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    }

    #ar-button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <model-viewer
    src="SONIM.glb"
    alt="SONIM"
    camera-controls
    autoplay
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    shadow-intensity="1"
    environment-image="neutral">

    <button slot="ar-button" id="ar-button">
      VIEW IN AR
    </button>

  </model-viewer>

</body>
</html>
