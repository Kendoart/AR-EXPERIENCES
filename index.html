<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SONIM AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    /* AR BUTTON */
    #ar-button {
      position: absolute;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);

      background: white;
      color: black;

      border: none;
      border-radius: 30px;

      padding: 16px 32px;

      font-size: 17px;
      font-weight: bold;

      letter-spacing: 0.5px;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);

      cursor: pointer;
      z-index: 10;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>

<body>

  <model-viewer
    src="SONIM.glb"
    alt="SONIM"
    camera-controls
    autoplay
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    shadow-intensity="1"
    environment-image="neutral">

    <button slot="ar-button" id="ar-button">
      VIEW IN AR
    </button>

  </model-viewer>

</body>
</html>
