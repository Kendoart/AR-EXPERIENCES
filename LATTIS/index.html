<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LATTIS</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

  <model-viewer
    src="LATTIS.glb"
    alt="LATTIS"
    camera-controls
    autoplay
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    shadow-intensity="1"
    environment-image="neutral">

    <button slot="ar-button" id="ar-button">
      View in AR
    </button>

  </model-viewer>

</body>
</html>
