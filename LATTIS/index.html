<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0">

<a-scene
  mindar-image="imageTargetSrc: ./LATTIS.mind?v=999;
                autoStart: true;
                filterMinCF: 0.0001;
                filterBeta: 0.001;"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="lattisModel"
      src="./LATTIS.glb?v=999">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>

  <a-entity
    light="type:ambient; intensity:1.2">
  </a-entity>

  <a-entity mindar-image-target="targetIndex:0">

    <a-gltf-model
      id="lattis"
      src="#lattisModel"
      position="0 0 0"
      rotation="0 0 0"
      scale="1 1 1">
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>
const model = document.querySelector('#lattis');

model.addEventListener('model-loaded', () => {
  console.log('★★★★★ LATTIS GLB LOADED ★★★★★');
});

model.addEventListener('model-error', (e) => {
  console.error('!!!!!!!! LATTIS GLB ERROR !!!!!!!!', e);
});
</script>

</body>
</html>
